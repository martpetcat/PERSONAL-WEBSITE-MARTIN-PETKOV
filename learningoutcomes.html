    <section class="lo-section" id="LO6">
      <h2>LO 6: Professional Identity - Reflection</h2>
      <p>Building a strong personal and professional brand identity through research and experimentation.</p>
      <div class="columns">
        <div class="col">
          <h3>Reflection</h3>
          <p>Despite setbacks, this branding project offered me a foundation for applying creative thinking to a real client. It clarified my understanding of identity design and communication, while also highlighting how early-stage organization affects late-stage delivery.
            <ul>
              <li>Establish clear file hierarchy from Day 1 - Did so later than I should've had.</li>
              <li>Setup all shared links and folders at project start into a Personal Drive, not only the Student one.</li>

  <template id="fixux">
    <div>
      <h2 class="project-title">Fix UX Project</h2>
      <p class="sub-header">Martin Petkov</p>
      <!-- fit the content where it was supposed to be -->
      <iframe style="border: 1px solid rgba(0, 0, 0, 0.1);" width="800" height="450" src="https://embed.figma.com/design/lG6koIidPxjWp1VY7WlTWv/PICCO-APP?node-id=145-46&embed-host=share" allowfullscreen></iframe>    

      <section class="lo-section" id="LO1">
        <h2>LO 1: Interactive Media Products</h2>
        <!-- <p>This learning outcome is demonstrated through prototypes and media concepts that were developed, tested, and refined based on user feedback and UX principles.</p> -->

        <div class="columns">
          <div class="col">
            
            <h3>Action</h3>
            <p>I designed an interactive quiz app prototype inspired by Picoo’s existing game options, extending the group’s research efforts. My focus was on creating engaging and intuitive visual cues for children, synergizing my concept with the group’s work on the "Custom Quizstafette." I developed a UI template informed by both external research and hands-on testing. To gather authentic user feedback, I conducted interviews and observational user tests, including one with my younger sister.</p>

            <div class="image-row">
              <!--zoom nnto working all of a sudden-->
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/overview.png" alt="Action 1" onclick="zoomImage(this)">  
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/overview.png" alt="Action 1" onclick="zoomImage(this)">  
              
              <!-- <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/iteration1.png" alt="Action 1" onclick="zoomImage(this)">   -->
              <!-- <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/wireframes.png" alt="interview 1" onclick="zoomImage(this)">   -->
              <!-- <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/wireframes2.png" alt="Action 1"  onclick="zoomImage(this)">   -->
              <!-- <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/iteration1.png" alt="Action 1"  onclick="zoomImage(this)">   -->
            </div>

            <h3>Feedback - Interview Documented on Notion</h3>
            <p>Users expressed the need for clearer visual context, more answer options, and immediate feedback on their responses. They also wanted more colorful and animated elements to increase engagement.</p>

            <div class="image-row">
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/interview-1.png" alt="interview 1"  onclick="zoomImage(this)">  
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/interview-2.png" alt="Action 1"  onclick="zoomImage(this)">  
            </div>

            <h3>Reflection</h3>
            <p>I realized that structured interview questions alone were insufficient; observing user interactions revealed deeper insights into usability challenges. Visual clarity and playful feedback mechanisms are essential to maintain user interest and improve comprehension, especially for children who are the primary demographic.</p>

            <h3>Decision</h3>
            <p>Based on these insights, I refined the app by adding 3 types of interactions, with images and choices, instant audio-visual feedback and user options. This user-centric iterative process improved the overall design and usability, aligning with the project goals.</p>

            <div class="image-row">
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/effect1.png" alt="interview 1"  onclick="zoomImage(this)">
            </div>
            <p>1. Shadowed Image Method-shadow overlay on the image being questioned. This makes the visual less obvious at first glance, turning the question into a subtle puzzle. It still provides visual input, but adds a layer of challenge, encouraging users to think critically before answering.
            </p>
            <div class="image-row">
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/effect2.png" alt="Action 1"  onclick="zoomImage(this)">  
            </div>
            <p> 2. Blurred Image with Reveal Option- The second method displays a blurred image. Users can choose to reveal the image for extra help or take a chance and guess without assistance. This interaction gives users — especially children — a sense of control, which is key to spontaneous learning and exploration.
            </p>
              <!-- <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/effect2.png" alt="Action 1"  onclick="zoomImage(this)">   -->
            <div class="image-row">
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/effect3.png" alt="Action 1"  onclick="zoomImage(this)">  
            </div>
            <p> 3. Reward-Based Visual Feedback
              The third method presents a regular quiz question enhanced by visual cues to maintain user focus. When the user answers correctly, they are rewarded with a visual treat — such as a GIF or short clip from a related film. This boosts motivation, supports faster comprehension, and creates a more entertaining and educational experience with the Picoo product.
            </p>
          </div>
        </div>
      </section>
    </div>
    <section class="lo-section" id="LO2">
      <h2>LO 2: Development & version control – Learning and Reflection</h2>
      <p>This learning outcome is demonstrated through structured project management, organized documentation, and progress tracking to ensure a professional and efficient workflow.</p>

        <div class="columns">
          <div class="col">
            
            <h3>Action </h3>
            <p>As part of the Picoo group project, I contributed a detailed UI concept in Figma for a kid-friendly quiz app based on the Quizstafette structure. I focused on translating research and user feedback into a clear visual interface that could later be implemented. My main priority was to solidify the UX/UI and ensure documentation of this process was completed for my portfolio.</p>

            <h3>Feedback - What others said about it</h3>
            <div class="image-row">
              <img src="semester2-module2-cmk2/iterations-projects/ux/portfolioUX/notes(4).png"alt="Action 1"  onclick="zoomImage(this)">  
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/transcribing-2.png"alt="Action 2"  onclick="zoomImage(this)">  
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/miscommunication.png"alt="Action 2"  onclick="zoomImage(this)">  

            </div>
            <p>During the checkpoint presentation, I was asked why there wasn’t a functioning coded prototype yet, and why the concept focused mainly on Quizstafette. The feedback emphasized the importance of not only planning but also implementing front-end components in code — especially since Figma alone doesn't demonstrate full development skills. I was encouraged to move beyond the design stage and showcase coding capability, even if just as a minimal working example.</p>

            <h3>Reflection -  What I learned from it</h3>
            <p>This feedback reminded me that in front-end development, visual planning and documentation are not enough without also producing coded output. While I defended my process as intentional (to stay organized and not rushed), I realized the importance of showing initiative through small functional builds, especially after presenting my ideas with the UX teachers that dayb who said I must continue this work beyond the UX project deadline, using my Figma concept as a launchpad for a clean and focused implementation into code.</p>

            <h3>Decision</h3>
            <p>In response, I explained that I had prioritized clear documentation and design first, intending to revisit and code the prototype after finalizing my portfolio structure. I also acknowledged that expanding beyond just the Quizstafette would show better versatility. Therefore, I made the decision to:

              - Revisit my checkpoints after documentation is complete.

              - Begin coding the UI as a working prototype using HTML, CSS, and JavaScript.

              - Use version control (GitHub) to document my progress and iterations.

              - Consider applying the UI framework to a second game type or variation to show broader applicability.
            </p>
            

          </div>
        </div>

    </section>
    
    <section class="lo-section" id="LO3">
      <h2>LO 3: Professional Design Tool Proficiency and Iterative Visual Design</h2>
      <p>Understanding the iterative process and refining designs based on feedback.</p>
        <div class="columns">
          <div class="col">
            
            <h3>Action</h3>
            <p>I used Figma to explore different visual directions, like layering, grain, and gradients. I merged stylescapes and refined layout from feedback. I learned to design with intention, adapting the UI to the artist’s emotional needs.</p>
            <h3>Feedback</h3>

    <section class="lo-section" id="LO4">
      <h2>LO 4: Research & Professional Standards</h2>
      <p>Conducting appropriate exploratory research methods, practicing clear communication, structured teamwork, and professionally organized documentation and reporting. I researched the artist’s lyrics, moodboards, and tone of voice. I used this to guide my design decisions and document what worked or didn’t. I learned to balance experimental ideas with clarity.
      </p>

      <div class="columns">
        <div class="col">
          
          <h3>Action</h3>
          <p>To begin the project, we reviewed the Picoo product and conducted exploratory research by testing it hands-on. This helped us understand its core experience and current limitations.
          We attempted to reach out to kindergartens for direct user interviews (including OBS Klimboom), as referred by Picoo stakeholders, but did not receive a response. To compensate, I conducted my own user interview with my younger sister, age 13, to observe how children interact with quiz content.

          Our team created a shared set of interview questions and began testing with educators. We also explored competitor platforms such as Kahoot, Quizlet, Socrative, and ClassDojo to analyze existing features, interface design, and game-based learning strategies.

          We brainstormed improvement ideas for the Picoo interface and shared them with stakeholders in follow-up meetings.</p>

          <h3>Feedback</h3>

          <div class="image-row">
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/transcribing-1.png"alt="Action 1"  onclick="zoomImage(this)">  
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/transcribing-2.png"alt="Action 2"  onclick="zoomImage(this)">  
              <img src="semester2-module2-cmk2/iterations-projects/ux/PicooUX/miscommunication.png"alt="Action 2"  onclick="zoomImage(this)">  

            </div>


          <p>From teacher interviews, we learned:

            Many teachers want both custom and pre-made quizzes.

            Laptops or desktops are preferred for quiz creation due to typing ease.

            A common frustration is limited question variety and the static timer.

            Picoo’s strength lies in promoting active, screen-free play, but its interface lacks flexibility.

            From teacher Chris (UX coach), we received key feedback:

            Don’t rely too heavily on structured interview questions.

            Observation-based testing reveals deeper insight.

            Body language, hesitation, and behavior can reveal more than verbal answers.

            Always record or document user sessions with permission.

            From my group:

            I was reminded to stay more involved and consistent. Despite a rough start, I aimed to improve by contributing interviews, user tests, and visual research.</p>

          <h3>Decision</h3>
          <p>We decided to:

            Adjust our interview questions to be more open-ended and behavior-focused.

            Focus on a specific game mode (Quizstafette) to develop and test a prototype.

            Incorporate visual cues and feedback systems (sound, lights, animation) based on user suggestions.

            Integrate inspiration from ClassDojo and Gartic Phone-style avatars to make our design more engaging for kids.

            While I wasn’t always able to attend every team meeting, I still contributed by exploring and documenting real user interaction with the product, building on the team’s concept direction.
          </p>
          <h3>Reflection</h3>
          <p>This process helped me understand the importance of grounding design in real user needs. While structured questions are helpful, watching users in action — especially children — reveals far more.

          I also learned how stakeholder alignment is crucial. From interview input, to idea validation, to visual decisions, everything ties back to how clearly we understood the people we’re designing for.

          Lastly, this outcome pushed me to reflect on my own contribution. I took ownership of designing and documenting a quiz prototype, inspired by Picoo’s model, even without a kindergarten interview. This balance of individual and team insight shaped a more relevant and human-centered result.</p>

        </div>
      </div>
    
    </section>
